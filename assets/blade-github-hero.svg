<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">Blade — Reforged</title>
  <desc id="desc">A dark red moonlit banner for Blade, a Firefox-based browser for Windows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110b10"/>
      <stop offset=".52" stop-color="#1c1018"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="moon" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#f4cbd0" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#b74a59" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#741a2b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#350b15" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e1826" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ed4355" stop-opacity=".85"/>
      <stop offset="1" stop-color="#5e1826" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ed233e" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ed233e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="stars" width="86" height="73" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="15" r="1" fill="#fff" opacity=".22"/>
      <circle cx="55" cy="47" r=".8" fill="#fff" opacity=".16"/>
      <circle cx="76" cy="24" r="1" fill="#ea6471" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="1440" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="460" rx="24" fill="url(#stars)"/>
  <ellipse cx="1117" cy="222" rx="300" ry="250" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="1117" cy="210" r="158" fill="url(#moon)" stroke="#ffdce0" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="1064" cy="160" r="19" fill="#4c1420" opacity=".22"/>
  <circle cx="1164" cy="248" r="31" fill="#4c1420" opacity=".18"/>
  <circle cx="1084" cy="281" r="11" fill="#f7c8ce" opacity=".2"/>
  <circle cx="1192" cy="143" r="8" fill="#f7c8ce" opacity=".18"/>
  <ellipse cx="1117" cy="210" rx="187" ry="158" fill="none" stroke="#e8495d" stroke-opacity=".28" stroke-width="1.5"/>
  <ellipse cx="1117" cy="210" rx="219" ry="158" fill="none" stroke="#e8495d" stroke-opacity=".12" transform="rotate(-22 1117 210)"/>

  <path d="M0 363C236 310 424 417 670 370s483-81 770-14v104H0z" fill="#08080b" opacity=".88"/>
  <path d="M0 363C252 316 438 415 671 369s484-78 769-13" fill="none" stroke="url(#horizon)" stroke-width="2"/>
  <path d="M0 398c207-41 339 31 502 0s281-31 442 0 310 11 496-7" fill="none" stroke="#591520" stroke-opacity=".32"/>
  <g fill="#ff7380">
    <circle cx="1015" cy="344" r="2.1" opacity=".76"/><circle cx="1054" cy="376" r="1.2" opacity=".62"/>
    <circle cx="1206" cy="341" r="1.8" opacity=".68"/><circle cx="1268" cy="318" r="1.1" opacity=".76"/>
    <circle cx="1334" cy="369" r="1.6" opacity=".48"/><circle cx="938" cy="391" r="1.3" opacity=".56"/>
  </g>

  <path d="M78 78h62M78 78v62M1362 382h-62M1362 382v-62" fill="none" stroke="#d32a40" stroke-opacity=".62" stroke-width="2"/>
  <text x="112" y="158" fill="#ff596a" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5">BROWSER // FIREFOX BUILD</text>
  <text x="106" y="235" fill="#fff4f5" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="3">BLADE</text>
  <text x="112" y="280" fill="#f1e6e8" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="1">ТВОЙ БРАУЗЕР. ТВОИ ПРАВИЛА.</text>
  <rect x="112" y="318" width="335" height="42" rx="8" fill="#32131b" stroke="#a72b3c" stroke-opacity=".82"/>
  <circle cx="132" cy="339" r="4" fill="#ff475d"/>
  <text x="148" y="345" fill="#ffe7e9" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ПЕРЕКОВКА · REFORGED</text>
  <text x="112" y="405" fill="#d2c2c6" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2.5">WINDOWS X64 · DARK FANTASY · GECKO</text>
  <rect x="1" y="1" width="1438" height="458" rx="23" fill="none" stroke="#652934" stroke-opacity=".8"/>
</svg>
