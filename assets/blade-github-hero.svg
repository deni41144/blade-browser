<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">Blade — Blood Moon</title>
  <desc id="desc">Blade browser, a dark Firefox build with the Blood Moon release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d12"/>
      <stop offset=".58" stop-color="#1d1118"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="moon" cx=".48" cy=".45" r=".58">
